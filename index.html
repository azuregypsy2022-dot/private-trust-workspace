:root{
  --paper:#FAF7F0;
  --paper-2:#F1EADF;
  --surface:#FFFEFB;
  --ink:#1A2B4A;
  --ink-soft:#3E4D68;
  --muted:#6B7280;
  --gold:#C5A880;
  --gold-dark:#9A7E58;
  --line:#DDD3BE;
  --line-strong:#1A2B4A;
  --sage:#E8EEE6;
  --rose:#F6E8E4;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --paper:#12161F;
    --paper-2:#1B2230;
    --surface:#1D2635;
    --ink:#F2EEDF;
    --ink-soft:#C9CFDD;
    --muted:#9AA3B5;
    --gold:#D4BC90;
    --gold-dark:#C5A880;
    --line:#39455B;
    --line-strong:#F2EEDF;
    --sage:#26342A;
    --rose:#3A2A2A;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.6
}

p,li,td,th,label,span,div{
  line-height:1.6
}

.font-serif-display{
  font-family:"Fraunces",Georgia,"Times New Roman",serif
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

input,select,textarea{
  background:transparent
}

input:focus,select:focus,textarea:focus{
  outline:2px solid var(--gold);
  outline-offset:1px;
  border-color:var(--gold)
}

.ledger-input{
  width:100%;
  border:0;
  border-bottom:1px solid transparent;
  padding:7px 6px;
  color:var(--ink);
  font-size:13px
}

.ledger-input:hover{
  border-bottom-color:var(--line)
}

.field{
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px 16px;
  background:var(--surface);
  color:var(--ink);
  font-size:14px;
  line-height:1.6
}

.field-label{
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  font-weight:800;
  color:var(--muted);
  margin-bottom:10px;
  display:block;
  line-height:1.6
}

.gold-rule{
  height:3px;
  background:var(--gold);
  width:56px
}

.paper-shadow{
  box-shadow:0 14px 42px rgba(26,43,74,.08)
}

.tab-btn{
  transition:.18s ease;
  padding:13px 20px !important;
  line-height:1.6
}

.tab-btn[aria-selected="true"]{
  background:var(--ink);
  color:#FAF7F0
}

/* ---- Layout breathing room: spacing only, no content or colour changes ---- */

main{
  padding:40px 24px 64px !important
}

header>div,footer>div{
  padding-left:24px !important;
  padding-right:24px !important
}

header>div{
  padding-top:28px !important;
  padding-bottom:28px !important
}

header nav{
  margin-top:28px !important;
  gap:12px !important;
  padding-bottom:8px !important;
  scrollbar-gutter:stable
}

main>section{
  margin-top:0
}

main>section+section{
  margin-top:32px
}

/* Every nested section/card gets at least 24px separation and 20px+ padding. */

main section{
  margin-top:28px
}

main section:first-child{
  margin-top:0
}

main section.rounded-2xl,main article.rounded-2xl{
  padding:28px !important
}

main article.rounded-xl,main div.rounded-xl{
  padding:20px
}

main section.rounded-2xl section,main section.rounded-2xl article{
  padding:24px
}

main section section{
  margin-top:28px
}

main section section:first-child{
  margin-top:0
}

/* Banners, alerts and status messages get breathing room. */

main p[role="status"],main p[role="alert"],main div[role="status"]{
  padding:14px 18px !important;
  margin-top:16px !important
}

/* Buttons: more padding and clearer separation, without changing their order or labels. */

main button,header button,footer button{
  line-height:1.6
}

main button[class*="rounded-full"]{
  padding:13px 22px !important
}

main button[class*="rounded-full"][class*="px-2"],main button[class*="rounded-full"][class*="px-3"]{
  padding:10px 16px !important
}

main .flex.flex-wrap,main .flex-wrap{
  row-gap:12px
}

main .flex.gap-2,main .flex.flex-wrap.gap-2{
  -moz-column-gap:12px;
       column-gap:12px
}

/* Forms: labels above inputs (already in markup), full-width fields, generous gaps, 2-column max. */

main form,main label{
  display:block
}

main label{
  margin-bottom:4px
}

main .grid{
  gap:22px !important;
  row-gap:22px !important
}

main .grid.gap-3{
  gap:22px !important
}

main .space-y-2>*+*{
  margin-top:14px !important
}

main .space-y-3>*+*{
  margin-top:18px !important
}

main ul.space-y-2 li,main ul.space-y-3 li{
  padding:14px 18px !important
}

/* Tables: horizontal scroll is already provided by overflow-x-auto wrappers; add sticky headers and roomy cells. */

main .overflow-x-auto{
  overflow-x:auto !important;
  -webkit-overflow-scrolling:touch
}

main table{
  border-collapse:separate;
  border-spacing:0
}

main table th,main table td{
  padding:14px 18px !important;
  line-height:1.6;
  vertical-align:top
}

main table thead th{
  position:sticky;
  top:0;
  z-index:1;
  background:var(--paper-2)
}

main table tbody tr td{
  border-top:1px solid var(--line)
}

/* Headings and paragraphs keep generous rhythm. */

main h2{
  margin-bottom:6px
}

main h3{
  margin-bottom:6px
}

main p{
  margin-top:6px
}

@media (min-width:640px){
  main{
    padding:48px 32px 72px !important
  }

  header>div,footer>div{
    padding-left:32px !important;
    padding-right:32px !important
  }

  main section.rounded-2xl,main article.rounded-2xl{
    padding:32px !important
  }
}

@media (min-width:768px){
  /* Two-column maximum for form/filter grids that previously used three columns. */

  main .md\:grid-cols-3,main .lg\:grid-cols-3{
    grid-template-columns:repeat(2,minmax(0,1fr)) !important
  }
}

@media (max-width:767px){
  main .grid{
    grid-template-columns:minmax(0,1fr) !important
  }

  main input,main select,main textarea{
    width:100%
  }

  main section.rounded-2xl,main article.rounded-2xl{
    padding:24px !important
  }

  main table{
    min-width:760px
  }
}

@media (max-width:430px){
  main{
    padding-left:20px !important;
    padding-right:20px !important
  }

  header>div,footer>div{
    padding-left:20px !important;
    padding-right:20px !important
  }
}

@media print{
  body{
    background:#fff!important;
    color:#111!important
  }

  .no-print{
    display:none!important
  }

  .paper-shadow{
    box-shadow:none!important
  }

  .print-block{
    -moz-column-break-inside:avoid;
         break-inside:avoid
  }
}

.hover\:bg-\[var\(--paper-2\)\]:hover {
  background-color: var(--paper-2);
}

.hover\:text-red-700:hover {
  --tw-text-opacity: 1;
  color: rgb(185 28 28 / var(--tw-text-opacity, 1));
}

@media (min-width: 640px) {
  .sm\:col-span-2 {
    grid-column: span 2 / span 2;
  }

  .sm\:hidden {
    display: none;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:py-10 {
    padding-top: 2.5rem;
    padding-bottom: 2.5rem;
  }

  .sm\:pb-8 {
    padding-bottom: 2rem;
  }

  .sm\:text-3xl {
    font-size: 1.875rem;
    line-height: 2.25rem;
  }

  .sm\:text-5xl {
    font-size: 3rem;
    line-height: 1;
  }

  .sm\:text-\[44px\] {
    font-size: 44px;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:col-span-2 {
    grid-column: span 2 / span 2;
  }

  .lg\:col-span-3 {
    grid-column: span 3 / span 3;
  }

  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-5 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }

  .lg\:grid-cols-6 {
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1fr_280px\] {
    grid-template-columns: 1fr 280px;
  }

  .lg\:grid-cols-\[1fr_300px\] {
    grid-template-columns: 1fr 300px;
  }
}

n when the owner cannot be present.",canDo:"Buy or sell property, sign closing documents, manage rentals, and pay mortgage or property tax as authorised.",cannotDo:"Change the owner’s title in a way the POA does not allow, keep sale proceeds, or sign for property outside the stated scope.",whenToUse:"For a closing, a rental portfolio, or a property in another city or state.",lasts:"Often short-term — for one transaction or closing — but it can be ongoing for rental management.",tip:"State the property address, parcel, and transaction. Record or file the POA where local rules require it."},{name:"Tax & CPA / IRS",duration:"Ongoing",purpose:"Let a CPA, enrolled agent, or trusted agent handle tax filings and conversations with tax authorities.",canDo:"Prepare and file returns, talk with a CPA, and request transcripts as authorised.",cannotDo:"Make the agent personally liable for the tax, or replace IRS Form 2848 where the IRS requires it.",whenToUse:"For annual filings, an audit, or when a CPA needs authority to speak for the business.",lasts:"Often ongoing for a tax year or engagement, ending on the stated date or when revoked.",tip:"Note: IRS Form 2848 is separate. Ask the CPA whether the IRS, state agency, or both need their own authorisation."},{name:"Business Contracts & Vendors",duration:"Ongoing",purpose:"Keep contracts and vendor work moving when the owner is unavailable to sign every document.",canDo:"Sign contracts within the stated limit, approve invoices, and order supplies.",cannotDo:"Sign contracts above the stated dollar limit, commit the business to a new kind of obligation, or change ownership terms.",whenToUse:"For routine vendor agreements, renewals, and purchase orders during a busy period or absence.",lasts:"Ongoing until the stated end date, or for one named contract or vendor.",tip:"Add a dollar limit, a contract type, and a rule for when the agent must get approval first."},{name:"Business Operations / Day-to-Day Management",duration:"Ongoing",p
